[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [
  ".git",
  ".local",
  ".venv",
  "__pycache__",
  "data/generated",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PLE",
  "PLW",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "S101",
  "S104",
  "S404",
  "S603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = [
  ".git",
  ".local",
  ".venv",
  "__pycache__",
  "data/generated",
  "tests",
]
skips = [
  "B404",
  "B603",
]
