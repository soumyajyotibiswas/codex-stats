name: Feature Request
description: Suggest an improvement.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep examples synthetic and avoid sharing real usage data or conversation content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or insight would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy And Security Notes
      description: Does this require reading or writing any new data?
    validations:
      required: false
